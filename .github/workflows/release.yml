name: Release

# Publishes to npm when a GitHub Release is published.
# Requires an NPM_TOKEN secret (automation token) in the repository settings.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # prepublishOnly runs typecheck + lint + test + build before packing.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
